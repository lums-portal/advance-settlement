        const DOC_ACCEPT = ".pdf,.doc,.docx,.jpg,.jpeg,.png";
        const TAX_ACCEPT = ".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png";

        function filesToDocs(fileList) {
          return Array.from(fileList || []).map(f => ({
            id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            name: f.name,
            url: URL.createObjectURL(f)
          }));
        }

        // ---------- OCR ENGINE (runs in the browser) ----------
        async function ocrImageSource(src) {
          if (!window.Tesseract) throw new Error("Tesseract not loaded");
          const { data } = await Tesseract.recognize(src, "eng");
          return (data.text || "").trim();
        }

        async function ocrPdfFile(file) {
          if (!window.pdfjsLib) throw new Error("PDF.js not loaded");
          pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
          const maxPages = Math.min(pdf.numPages, 5);
          let out = [];
          for (let i = 1; i <= maxPages; i++) {
            const page = await pdf.getPage(i);
            const tc = await page.getTextContent();
            let text = tc.items.map(it => it.str).join(" ").trim();
            if (text.length < 30) {
              // scanned page: render to canvas and OCR it
              const viewport = page.getViewport({ scale: 2 });
              const canvas = document.createElement("canvas");
              canvas.width = viewport.width; canvas.height = viewport.height;
              await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
              text = await ocrImageSource(canvas);
            }
            out.push(text);
          }
          return out.join("\n\n").trim();
        }

        // Never throws. Returns { status: done|empty|unsupported|failed, text }
        async function runOcr(file) {
          try {
            const name = (file.name || "").toLowerCase();
            let text = "";
            if (/\.(jpg|jpeg|png)$/.test(name)) text = await ocrImageSource(file);
            else if (name.endsWith(".pdf")) text = await ocrPdfFile(file);
            else if (name.endsWith(".docx")) {
              if (!window.mammoth) throw new Error("Mammoth not loaded");
              const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
              text = (r.value || "").trim();
            } else {
              return { status: "unsupported", text: "" };
            }
            return text ? { status: "done", text } : { status: "empty", text: "" };
          } catch (err) {
            console.error("OCR failed:", err);
            return { status: "failed", text: "" };
          }
        }

        // Adds files to a docs state array and OCR-scans each one in the background
        function addDocsWithOcr(files, setter) {
          if (!files || files.length === 0) return;
          const docs = filesToDocs(files).map(d => ({ ...d, ocrStatus: "scanning", ocrText: "" }));
          setter(prev => [...prev, ...docs]);
          docs.forEach((d, i) => {
            runOcr(files[i]).then(r => {
              setter(prev => prev.map(x => x.id === d.id ? { ...x, ocrStatus: r.status, ocrText: r.text } : x));
            });
          });
        }

        // Tries to read a total amount out of OCR text (receipts / invoices)
        function detectAmount(text) {
          if (!text) return null;
          const m = text.match(/(?:grand\s*total|net\s*amount|amount\s*due|total)[^0-9]{0,25}([0-9][0-9,]*(?:\.[0-9]+)?)/i);
          if (!m) return null;
          const n = Number(m[1].replace(/,/g, ""));
          return isNaN(n) || n <= 0 ? null : n;
        }

        function OcrBadge({ item }) {
          if (!item || !item.ocrStatus) return null;
          const map = {
            scanning: ["🔎 Scanning text…", "bg-amber-50 text-amber-700 border-amber-200 animate-pulse"],
            done: ["✅ Text extracted", "bg-green-50 text-green-700 border-green-200"],
            empty: ["⚠️ No readable text found", "bg-amber-50 text-amber-700 border-amber-200"],
            unsupported: ["ℹ️ OCR not available for this file type", "bg-slate-50 text-slate-500 border-slate-200"],
            failed: ["❌ OCR failed (check internet connection)", "bg-red-50 text-red-700 border-red-200"]
          };
          const [label, cls] = map[item.ocrStatus] || map.failed;
          return <span className={`px-2 py-0.5 rounded-full border text-[10px] font-semibold ${cls}`}>{label}</span>;
        }

        function OcrDetails({ item }) {
          if (!item || !item.ocrText) return null;
          return (
            <details className="basis-full text-[11px] text-slate-600">
              <summary className="cursor-pointer text-blue-700 font-semibold">View extracted text</summary>
              <pre className="whitespace-pre-wrap bg-white border rounded p-2 mt-1 max-h-40 overflow-auto font-sans">{item.ocrText}</pre>
            </details>
          );
        }

        function DocLinks({ docs, empty }) {
          if (!docs || docs.length === 0) return <span className="text-slate-400">{empty || "None attached"}</span>;
          return (
            <div className="flex flex-col gap-1.5">
              {docs.map(d => (
                <div key={d.id} className="flex flex-wrap items-center gap-2">
                  <a href={d.url} download={d.name} className="text-blue-600 underline font-bold">📎 {d.name}</a>
                  <OcrBadge item={d} />
                  <OcrDetails item={d} />
                </div>
              ))}
            </div>
          );
        }

          const [newFundType, setNewFundType] = useState("current");
          const [newAmount, setNewAmount] = useState("");
          const [newPurpose, setNewPurpose] = useState("");
          const [newPurposeDocs, setNewPurposeDocs] = useState([]);

          const [showProfileForm, setShowProfileForm] = useState(false);
          const [newProfName, setNewProfName] = useState("");
          const [newProfRole, setNewProfRole] = useState("");
          const [fcSearchInput, setFcSearchInput] = useState("");
          const [selectedFcObj, setSelectedFcObj] = useState(null);

          const [budgetModalEmp, setBudgetModalEmp] = useState(null);
          const [editFcSelect, setEditFcSelect] = useState(OFFICIAL_FUND_CENTERS[0].code);

          const [treasurySelectedId, setTreasurySelectedId] = useState(null);
          const [bankRefInput, setBankRefInput] = useState("");

          const [financeSelectedId, setFinanceSelectedId] = useState(null);
          const [financeRejectReason, setFinanceRejectReason] = useState("");

          // Accounts: advance eligibility review (new step before Treasury)
          const [financeTab, setFinanceTab] = useState("advance_review");
          const [reviewSelectedId, setReviewSelectedId] = useState(null);
          const [reviewReasons, setReviewReasons] = useState([]);
          const [reviewOtherText, setReviewOtherText] = useState("");
          const [reviewTaxDocs, setReviewTaxDocs] = useState([]);
          const [reviewTaxNote, setReviewTaxNote] = useState("");

          // Accounts: two-step settlement posting (review & save -> final approval & post)
          const [postingNote, setPostingNote] = useState("");
          const [postingSelectedId, setPostingSelectedId] = useState(null);
          const [postingReturnReason, setPostingReturnReason] = useState("");

          // Master reset (password protected)
          const [showResetModal, setShowResetModal] = useState(false);
          const [resetPassword, setResetPassword] = useState("");
          const [resetError, setResetError] = useState("");

          // Admin dashboard: email reminders
          const [selectedReminderIds, setSelectedReminderIds] = useState([]);

          const [hodSelectedFc, setHodSelectedFc] = useState("ALL");
          const [settlementChoices, setSettlementChoices] = useState({ 2: { mode: "salary_deduction", ref: "", fileName: "" } });

          const [startDateFilter, setStartDateFilter] = useState("2026-01-01");
          const [endDateFilter, setEndDateFilter] = useState("2026-12-31");
          const [summaryDropdownOpen, setSummaryDropdownOpen] = useState({ open: true, partial: true, settled: true });
          const [selectedAgingBucket, setSelectedAgingBucket] = useState(null);
          const [dashboardSort, setDashboardSort] = useState("recent_old");

          function performMasterReset(e) {
            e.preventDefault();
            if (resetPassword !== MASTER_RESET_PASSWORD) {
              setResetError("Incorrect password. Master reset not authorised.");
              return;
            }
            localStorage.removeItem("lums_employees");
            localStorage.removeItem("lums_advances");
            setEmployees(INITIAL_EMPLOYEES);
            setAdvances(INITIAL_ADVANCES);
            setCurrentEmployeeId("e2");
            setRole("employee");
            setOpenId(2);
            setDraftLines({
              2: [{ id: 99, description: "Transit handling fee", category: "Supplies", amount: "30000", fileName: "transit_invoice.pdf", fileUrl: "", isScanning: false }]
            });
            setSettlementChoices({ 2: { mode: "salary_deduction", ref: "", fileName: "" } });
            setShowNewForm(false); setNewAmount(""); setNewPurpose(""); setNewPurposeDocs([]);
            setTreasurySelectedId(null); setBankRefInput("");
            setFinanceSelectedId(null); setFinanceRejectReason("");
            setReviewSelectedId(null); resetReviewForm();
            setPostingSelectedId(null); setPostingReturnReason(""); setPostingNote("");
            setSelectedReminderIds([]); setSelectedAgingBucket(null);
            setShowResetModal(false); setResetPassword(""); setResetError("");
            alert("Master reset complete. All portal data has been restored to the original defaults.");
          }

          function empOf(a) { return employees.find((e) => e.id === a.employeeId); }
          function update(id, patch) { setAdvances((as) => as.map((a) => (a.id === id ? { ...a, ...patch } : a))); }
          
          function generateNextPrNumber() {
            let maxSeq = 340000000;
            advances.forEach(a => {
              if (a.prNumber && a.prNumber.startsWith("PR-34000")) {
                const seqPart = parseInt(a.prNumber.replace("PR-", ""), 10);
                if (!isNaN(seqPart) && seqPart > maxSeq) {
                  maxSeq = seqPart;
                }
              }
            });
            return `PR-${maxSeq + 1}`;
          }

          function getDraft(advanceId) { return draftLines[advanceId] || [initialLine()]; }
          function setDraft(advanceId, lines) { setDraftLines((d) => ({ ...d, [advanceId]: lines })); }
          function addLine(advanceId) { setDraft(advanceId, [...getDraft(advanceId), initialLine()]); }
          function removeLine(advanceId, id) { setDraft(advanceId, getDraft(advanceId).filter((l) => l.id !== id)); }
          function editLine(advanceId, id, field, value) {
            setDraft(advanceId, getDraft(advanceId).map((l) => (l.id === id ? { ...l, [field]: value } : l)));
          }

          function handleFileUpload(advanceId, id, file) {
            if (!file) return;
            const fileUrl = URL.createObjectURL(file);
            setDraft(advanceId, getDraft(advanceId).map((l) => {
              if (l.id === id) {
                return { ...l, fileName: file.name, fileUrl: fileUrl, description: l.description || file.name.split('.')[0], isScanning: false, ocrStatus: "scanning", ocrText: "" };
              }
              return l;
            }));
            runOcr(file).then(r => {
              setDraftLines(d => ({
                ...d,
                [advanceId]: (d[advanceId] || []).map(l => (l.id === id && l.fileName === file.name) ? { ...l, ocrStatus: r.status, ocrText: r.text } : l)
              }));
            });
          }

          function removeAttachment(advanceId, id) {
            setDraft(advanceId, getDraft(advanceId).map((l) => {
              if (l.id === id) {
                return { ...l, fileName: "", fileUrl: "", ocrStatus: "", ocrText: "" };
              }
              return l;
            }));
          }

          function handleRefundProofUpload(advanceId, file) {
            if (!file) return;
            const url = URL.createObjectURL(file);
            setSettlementChoices(prev => ({
              ...prev,
              [advanceId]: { ...(prev[advanceId] || {}), fileName: file.name, fileUrl: url }
            }));
          }

          function handleCreateEmployeeProfile(e) {
            e.preventDefault();
            if (!newProfName || !newProfRole || !selectedFcObj) {
              alert("Please fill in all details and select a valid Fund Center from the official LUMS list.");
              return;
            }
            const newEmp = {
              id: `e_${Date.now()}`,
              name: newProfName,
              role: newProfRole,
              dept: selectedFcObj.name,
              fundCenterNum: selectedFcObj.code,
              fundCenterName: selectedFcObj.name,
              workflowStatus: "pending_budget"
            };
            setEmployees([...employees, newEmp]);
            setCurrentEmployeeId(newEmp.id);
            setNewProfName("");
            setNewProfRole("");
            setFcSearchInput("");
            setSelectedFcObj(null);
            setShowProfileForm(false);
            alert("Profile request submitted successfully! It is currently pending Budget & IT vetting.");
          }

          function handleBudgetSubmit(e) {
            e.preventDefault();
            if (!editFcSelect) return;
            const fcObj = OFFICIAL_FUND_CENTERS.find(f => f.code === editFcSelect);
            setEmployees(employees.map(e => e.id === budgetModalEmp.id ? {
              ...e, fundCenterNum: editFcSelect, fundCenterName: fcObj ? fcObj.name : editFcSelect, dept: fcObj ? fcObj.name : e.dept, workflowStatus: "pending_it"
            } : e));
            setBudgetModalEmp(null);
          }

          function handleItConfigure(empId) {
            setEmployees(employees.map(e => e.id === empId ? { ...e, workflowStatus: "active" } : e));
          }

          function deleteEmployee(empId) {
            if (employees.length <= 1) { alert("Cannot delete the last remaining employee profile."); return; }
            if (confirm("Are you sure you want to remove this employee profile?")) {
              setEmployees(employees.filter(e => e.id !== empId));
              if (currentEmployeeId === empId) {
                const remaining = employees.filter(e => e.id !== empId);
                setCurrentEmployeeId(remaining[0].id);
              }
            }
          }

          function submitNewApplication(e) {
            e.preventDefault();
            const emp = employees.find(e => e.id === currentEmployeeId);
            if (!emp || emp.workflowStatus !== "active") {
              alert("Access Denied: Profile is undergoing Budget & IT vetting and is not yet active.");
              return;
            }
            if (newFundType === "grant" && !hasGrantFundAccess(emp)) {
              alert("Access Denied: You do not have an active grant fund authorisation for PR creation.");
              return;
            }
            if (!newAmount || !newPurpose) return;

            const nextPr = generateNextPrNumber();
            const newAdv = {
              id: Date.now(), employeeId: currentEmployeeId, prNumber: nextPr,
              amount: Number(newAmount), dept: emp.dept, fundCenterNum: emp.fundCenterNum,
              fundCenterName: emp.fundCenterName, purpose: newPurpose, disbursedOn: null,
              status: "pending_hod", claim: { lines: [] }, sapDocRef: null, disbursementRef: null,
              settlementMode: null, refundDetails: null, rejectionReason: null,
              fundType: newFundType,
              purposeDocs: newPurposeDocs
            };
            setAdvances([newAdv, ...advances]);
            setNewAmount(""); setNewPurpose(""); setNewPurposeDocs([]); setShowNewForm(false);
          }

          function hodAction(id, approve) {
            if (!approve) { setAdvances(advances.filter(a => a.id !== id)); } 
            else { update(id, { status: "pending_accounts" }); }
          }

          // ---- Accounts: advance eligibility review ----
          function toggleReviewReason(reason) {
            setReviewReasons(prev => prev.includes(reason) ? prev.filter(r => r !== reason) : [...prev, reason]);
          }

          function resetReviewForm() {
            setReviewReasons([]);
            setReviewOtherText("");
            setReviewTaxDocs([]);
            setReviewTaxNote("");
          }

          function accountsApproveAdvance(id) {
            const today = new Date().toISOString().split('T')[0];
            update(id, { status: "pending_treasury", accountsReviewedOn: today, rejectionReasons: [], rejectionNote: "", taxWorking: { docs: reviewTaxDocs, note: reviewTaxNote.trim() } });
            resetReviewForm();
            setReviewSelectedId(null);
            alert("Advance request cleared by Accounts and forwarded to Treasury for disbursement.");
          }

          function accountsRejectAdvance(id) {
            if (reviewReasons.length === 0 && !reviewOtherText.trim()) {
              alert("Please select at least one reason or enter a reason manually before rejecting the advance request.");
              return;
            }
            const today = new Date().toISOString().split('T')[0];
            update(id, {
              status: "rejected",
              rejectionReasons: reviewReasons,
              rejectionNote: reviewOtherText.trim(),
              advanceRejectedOn: today
            });
            resetReviewForm();
            setReviewSelectedId(null);
            alert("Advance request rejected. The employee will see the rejection reasons in their portal.");
          }

          function confirmTreasuryDisbursement(id) {
            if (!bankRefInput) { alert("Please enter bank transfer reference."); return; }
            const today = new Date().toISOString().split('T')[0];
            update(id, { status: "outstanding", disbursedOn: today, disbursementRef: bankRefInput });
            setBankRefInput(""); setTreasurySelectedId(null);
          }

          function submitClaim(advance) {
            const lines = getDraft(advance.id).filter((l) => l.description.trim() && Number(l.amount) > 0);
            if (lines.length === 0) return;
            const totalClaimed = lines.reduce((s, l) => s + Number(l.amount), 0);
            
            if (totalClaimed > advance.amount) {
              const confirmOver = confirm(`⚠️ Warning: Total claimed receipts (${Number(totalClaimed).toLocaleString()}) exceed the disbursed advance amount (${Number(advance.amount).toLocaleString()}). Are you sure you want to submit this over-claim?`);
              if (!confirmOver) return;
            }

            const choice = settlementChoices[advance.id] || { mode: "salary_deduction", ref: "", fileName: "", fileUrl: "" };

            update(advance.id, { 
              claim: { lines }, 
              status: "submitted",
              rejectionReason: null,
              settlementMode: totalClaimed < advance.amount ? choice.mode : null,
              refundDetails: totalClaimed < advance.amount && choice.mode === "cash_refund" ? choice : null
            });
          }

          function financeSettle(advanceId) {
            const docRef = `FI-DOC-${80000 + Math.floor(Math.random() * 9000)}`;
            update(advanceId, { status: "settled", sapDocRef: docRef, rejectionReason: null, returnReason: null, postedOn: new Date().toISOString().split('T')[0], postedBy: getSapUserId() });
            setPostingSelectedId(null);
            setPostingReturnReason("");
            setFinanceSelectedId(null);
            setFinanceRejectReason("");
          }

          // Step 1: review complete -> save document for posting
          function financeSaveForPosting(advanceId) {
            const savedRef = `SAVED-${70000 + Math.floor(Math.random() * 9000)}`;
            update(advanceId, {
              status: "pending_posting",
              savedDocRef: savedRef,
              savedOn: new Date().toISOString().split('T')[0],
              savedBy: getSapUserId(),
              postingNote: postingNote.trim(),
              returnReason: null,
              rejectionReason: null
            });
            setFinanceSelectedId(null);
            setFinanceRejectReason("");
            setPostingNote("");
            alert(`Settlement reviewed and saved for posting (${savedRef}). It has been sent for final posting approval.`);
          }

          // Step 2: final posting - send back for review with reason
          function financeReturnForReview(advanceId) {
            if (!postingReturnReason.trim()) {
              alert("Please provide a reason for returning the saved document for review.");
              return;
            }
            update(advanceId, { status: "submitted", returnReason: postingReturnReason.trim(), savedDocRef: null });
            setPostingSelectedId(null);
            setPostingReturnReason("");
            alert("Saved document returned to the Accounts reviewer with your remarks.");
          }

          function financeReject(advanceId) {
            if (!financeRejectReason.trim()) {
              alert("Please provide a reason for rejecting the settlement request.");
              return;
            }
            update(advanceId, {
              status: "outstanding",
              rejectionReason: financeRejectReason.trim()
            });
            setFinanceSelectedId(null);
            setFinanceRejectReason("");
            alert("Settlement request rejected and sent back to the employee with intimation.");
          }

          // ---- Admin dashboard: settlement reminder emails ----
          function toggleReminderSelect(id) {
            setSelectedReminderIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          }

          function sendReminderEmails(list) {
            if (list.length === 0) {
              alert("No pending advances selected for reminders.");
              return;
            }
            const recipients = list.map(a => {
              const emp = empOf(a);
              return `• ${emp ? emp.name : "Unknown"} <${empEmail(emp)}> — ${a.prNumber} (${money(a.amount)}, ${daysAgo(a.disbursedOn)} days outstanding)`;
            }).join("\n");
            if (!confirm(`Send settlement reminder email for ${list.length} advance(s)?\n\n${recipients}`)) return;

            // ---- EMAIL INTEGRATION POINT ----
            // Call your email service / backend endpoint here for each advance in `list`
            // (recipient: empEmail(empOf(a)), subject/body referencing a.prNumber, a.amount, days outstanding).
            // Below, the reminder is only recorded in the portal.
            const today = new Date().toISOString().split('T')[0];
            const ids = list.map(a => a.id);
            setAdvances(as => as.map(a => ids.includes(a.id) ? { ...a, lastReminderOn: today, reminderCount: (a.reminderCount || 0) + 1 } : a));
            setSelectedReminderIds([]);
            alert(`Settlement reminder sent for ${list.length} advance(s).`);
          }

          const currentEmp = employees.find(e => e.id === currentEmployeeId) || employees[0];
          const myAdvances = advances.filter((a) => a.employeeId === currentEmployeeId);
          const hodQueue = advances.filter((a) => a.status === "pending_hod");
          const accountsReviewQueue = advances.filter((a) => a.status === "pending_accounts");
          const treasuryQueue = advances.filter((a) => a.status === "pending_treasury");
          const submittedQueue = advances.filter((a) => a.status === "submitted");
          const postingQueue = advances.filter((a) => a.status === "pending_posting");

          const pendingBudgetList = employees.filter(e => e.workflowStatus === "pending_budget");
          const pendingItList = employees.filter(e => e.workflowStatus === "pending_it");

          const filteredFcList = fcSearchInput.trim() === "" ? [] : OFFICIAL_FUND_CENTERS.filter(f => 
            f.code.toLowerCase().includes(fcSearchInput.toLowerCase()) || 
            f.name.toLowerCase().includes(fcSearchInput.toLowerCase())
          );

          const baseFilteredAdvances = advances.filter(a => {
            if (!a.disbursedOn) return true;
            return a.disbursedOn >= startDateFilter && a.disbursedOn <= endDateFilter;
          });

          const applyAgingAndSorting = (list) => {
            let filtered = list;
            if (selectedAgingBucket) {
              filtered = filtered.filter(a => {
                if (!a.disbursedOn) return false;
                return getAgingCategory(daysAgo(a.disbursedOn)) === selectedAgingBucket;
              });
            }

            return [...filtered].sort((a, b) => {
              if (dashboardSort === "recent_old") return new Date(b.disbursedOn || 0) - new Date(a.disbursedOn || 0);
              if (dashboardSort === "old_recent") return new Date(a.disbursedOn || 0) - new Date(b.disbursedOn || 0);
              if (dashboardSort === "aging_new_old") return daysAgo(a.disbursedOn) - daysAgo(b.disbursedOn);
              if (dashboardSort === "aging_old_new") return daysAgo(b.disbursedOn) - daysAgo(a.disbursedOn);
              if (dashboardSort === "amount_small_large") return a.amount - b.amount;
              if (dashboardSort === "amount_large_small") return b.amount - a.amount;
              return 0;
            });
          };

          const rawOpenAdvances = baseFilteredAdvances.filter(a => a.status === "outstanding");
          const rawPartialAdvances = baseFilteredAdvances.filter(a => {
            if (a.status !== "submitted" && a.status !== "pending_posting") return false;
            const claimed = a.claim.lines.reduce((s, l) => s + Number(l.amount), 0);
            return claimed < a.amount;
          });
          const rawSettledPRs = baseFilteredAdvances.filter(a => a.status === "settled");

          const summaryOpenAdvances = applyAgingAndSorting(rawOpenAdvances);
          const summaryPartialAdvances = applyAgingAndSorting(rawPartialAdvances);
          const summarySettledPRs = applyAgingAndSorting(rawSettledPRs);

          const selectedVisibleReminders = summaryOpenAdvances.filter(a => selectedReminderIds.includes(a.id));
          const allVisibleSelected = summaryOpenAdvances.length > 0 && selectedVisibleReminders.length === summaryOpenAdvances.length;

          const agingBuckets = { "<1 month": 0, "<3 months": 0, "<6 months": 0, "+6 months": 0 };
          rawOpenAdvances.forEach(a => {
            if (a.disbursedOn) {
              const d = daysAgo(a.disbursedOn);
              const b = getAgingCategory(d);
              agingBuckets[b] = (agingBuckets[b] || 0) + 1;
            }
          });

          return (
            <div className="min-h-screen bg-slate-50 pb-12" style={{ fontFamily: "system-ui, sans-serif" }}>
              <div className="border-b border-slate-200 bg-white px-6 py-4 flex flex-wrap justify-between items-center gap-4 shadow-sm">
                <div>
                  <div className="text-2xl md:text-3xl font-bold tracking-tight text-[#001b4d]">LUMS Enterprise Advance & Settlement Portal</div>
                  <div className="text-xs text-slate-500"></div>
                </div>
                
                <div className="flex flex-wrap items-center gap-3">
                  <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 gap-1">
                    <button onClick={() => setRole("employee")} className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${role === "employee" ? "bg-white text-[#001b4d] shadow-sm font-bold" : "text-slate-500"}`}>👤 Employee Portal</button>
                    <button onClick={() => setRole("hod")} className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${role === "hod" ? "bg-white text-[#001b4d] shadow-sm font-bold" : "text-slate-500"}`}>
                      👔 HoD Review {hodQueue.length > 0 && <span className="ml-1 bg-amber-500 text-white text-[10px] px-1.5 py-0.2 rounded-full">{hodQueue.length}</span>}
                    </button>
                  </div>

                  <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 gap-1">
                    <button onClick={() => setRole("it_budget")} className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${role === "it_budget" ? "bg-white text-[#001b4d] shadow-sm font-bold" : "text-slate-500"}`}>
                      ⚙️ Budget & IT {(pendingBudgetList.length > 0 || pendingItList.length > 0) && <span className="ml-1 bg-indigo-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">{pendingBudgetList.length + pendingItList.length}</span>}
                    </button>
                  </div>

                  <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 gap-1">
                    <button onClick={() => { setRole("treasury"); setTreasurySelectedId(treasuryQueue[0]?.id || null); }} className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${role === "treasury" ? "bg-white text-[#001b4d] shadow-sm font-bold" : "text-slate-500"}`}>
                      💰 Treasury {treasuryQueue.length > 0 && <span className="ml-1 bg-blue-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">{treasuryQueue.length}</span>}
                    </button>
                    <button onClick={() => { setRole("finance"); setFinanceSelectedId(submittedQueue[0]?.id || null); setReviewSelectedId(accountsReviewQueue[0]?.id || null); setPostingSelectedId(postingQueue[0]?.id || null); resetReviewForm(); }} className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${role === "finance" ? "bg-white text-[#001b4d] shadow-sm font-bold" : "text-slate-500"}`}>
                      🏛️ Accounts {(submittedQueue.length + accountsReviewQueue.length + postingQueue.length) > 0 && <span className="ml-1 bg-purple-600 text-white text-[10px] px-1.5 py-0.2 rounded-full">{submittedQueue.length + accountsReviewQueue.length + postingQueue.length}</span>}
                    </button>
                    <button onClick={() => setRole("admin_summary")} className={`px-3 py-1.5 rounded-md text-xs font-medium transition ${role === "admin_summary" ? "bg-white text-[#001b4d] shadow-sm font-bold" : "text-slate-500"}`}>
                      📊 Admin Dashboard
                    </button>
                  </div>

                  <button
                    onClick={() => { setShowResetModal(true); setResetPassword(""); setResetError(""); }}
                    title="Master reset (password required)"
                    className="px-2.5 py-1.5 rounded-md text-[11px] font-medium text-slate-500 border border-slate-200 bg-white hover:bg-slate-100 transition"
                  >
                    🔄 Master Reset
                  </button>
                </div>
              </div>

              <div className="max-w-5xl mx-auto px-6 pt-6">
                
                {role === "employee" && (
                  <div className="space-y-6">
                    <div className="flex flex-wrap items-center justify-between gap-4 bg-white p-4 rounded-xl border shadow-sm">
                      <div className="flex items-center gap-3">
                        <span className="text-xs font-bold text-slate-500 uppercase">Active Profile:</span>
                        <select value={currentEmployeeId} onChange={(e) => setCurrentEmployeeId(e.target.value)} className="border border-slate-300 bg-slate-50 px-3 py-1.5 text-sm rounded-md font-bold text-[#001b4d]">
                          {employees.map((e) => <option key={e.id} value={e.id}>{e.name} ({e.role}) — {e.fundCenterNum} {e.workflowStatus === 'active' ? '✓' : `(${e.workflowStatus})`}</option>)}
                        </select>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <button onClick={() => setShowProfileForm(!showProfileForm)} className="bg-slate-200 hover:bg-slate-300 text-slate-800 px-3 py-2 rounded-lg text-xs font-bold transition-colors">
                          {showProfileForm ? "Close Profile Form" : "➕ Create Employee Profile"}
                        </button>
                        {currentEmp && currentEmp.workflowStatus === 'active' ? (
                          <>
                            <button
                              onClick={() => {
                                if (showNewForm && newFundType === "current") { setShowNewForm(false); }
                                else { setNewFundType("current"); setShowNewForm(true); }
                              }}
                              className="bg-[#001b4d] text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-blue-900 transition-colors shadow-sm"
                            >
                              {showNewForm && newFundType === "current" ? "Cancel PR" : "➕ Apply for Advance - Current Fund"}
                            </button>
                            <button
                              disabled={!hasGrantFundAccess(currentEmp)}
                              title={hasGrantFundAccess(currentEmp) ? "Create a PR against an authorised grant fund" : "Not available: no active grant fund authorisation / PR creation rights (to be configured via SAP integration)"}
                              onClick={() => {
                                if (!hasGrantFundAccess(currentEmp)) return;
                                if (showNewForm && newFundType === "grant") { setShowNewForm(false); }
                                else { setNewFundType("grant"); setShowNewForm(true); }
                              }}
                              className={`px-4 py-2 rounded-lg text-xs font-bold transition-colors border ${
                                hasGrantFundAccess(currentEmp)
                                  ? "bg-[#001b4d] text-white hover:bg-blue-900 shadow-sm border-transparent"
                                  : "bg-slate-100 text-slate-400 border-slate-300 cursor-not-allowed opacity-70"
                              }`}
                            >
                              {hasGrantFundAccess(currentEmp)
                                ? (showNewForm && newFundType === "grant" ? "Cancel PR" : "➕ Apply for Advance - Grant Fund")
                                : "🔒 Apply for Advance - Grant Fund"}
                            </button>
                          </>
                        ) : (
                          <span className="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-3 py-2 rounded-lg font-medium">
                            ⚠️ Profile undergoing Budget & IT vetting
                          </span>
                        )}
                      </div>
                    </div>

                    {showProfileForm && (
                      <div className="bg-white border border-blue-200 rounded-xl p-5 shadow-md space-y-4">
                        <h3 className="text-sm font-bold text-[#001b4d]">Register Employee Profile & Select Fund Center</h3>
                        <p className="text-xs text-slate-500">Submitting this profile will route it to the Budget and IT teams for formal vetting and master data activation.</p>
                        <form onSubmit={handleCreateEmployeeProfile} className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                          <div>
                            <label className="font-semibold text-slate-600 block mb-1">Full Name</label>
                            <input type="text" required value={newProfName} onChange={e => setNewProfName(e.target.value)} placeholder="e.g. Zainab Noor" className="w-full border rounded p-2 text-sm bg-white" />
                          </div>
                          <div>
                            <label className="font-semibold text-slate-600 block mb-1">Job Role / Title</label>
                            <input type="text" required value={newProfRole} onChange={e => setNewProfRole(e.target.value)} placeholder="e.g. Senior Officer" className="w-full border rounded p-2 text-sm bg-white" />
                          </div>
                          <div className="md:col-span-2 relative">
                            <label className="font-semibold text-slate-600 block mb-1">Type & Select Official LUMS Fund Center (Strict Validation)</label>
                            <input 
                              type="text" 
                              value={fcSearchInput} 
                              onChange={e => { setFcSearchInput(e.target.value); setSelectedFcObj(null); }} 
                              placeholder="Type Fund Center code or department name (e.g. CUF1012011 or Finance)..." 
                              className="w-full border rounded p-2 text-sm bg-white font-mono" 
                            />
                            {selectedFcObj && (
                              <div className="mt-1 text-[11px] text-green-700 font-bold">
                                ✓ Validated: {selectedFcObj.code} — {selectedFcObj.name}
                              </div>
                            )}
                            {filteredFcList.length > 0 && !selectedFcObj && (
                              <div className="absolute z-10 w-full bg-white border border-slate-300 rounded-md shadow-lg max-h-48 overflow-y-auto mt-1">
                                {filteredFcList.map(fc => (
                                  <div 
                                    key={fc.code} 
                                    onClick={() => { setSelectedFcObj(fc); setFcSearchInput(`${fc.code} - ${fc.name}`); }}
                                    className="p-2 hover:bg-slate-100 cursor-pointer text-xs border-b border-slate-100 font-mono"
                                  >
                                    <strong>{fc.code}</strong> — {fc.name}
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                          <div className="md:col-span-2 flex justify-end pt-2">
                            <button type="submit" className="bg-[#001b4d] text-white px-5 py-2 rounded font-bold text-xs hover:bg-blue-900">Submit Profile for Budget & IT Vetting</button>
                          </div>
                        </form>
                      </div>
                    )}

                    {showNewForm && currentEmp && currentEmp.workflowStatus === 'active' && (
                      <div className="bg-white border border-blue-200 rounded-xl p-5 shadow-md">
                        <div className="flex justify-between items-center mb-3">
                          <h3 className="text-sm font-bold text-[#001b4d]">
                            Apply for Advance — {newFundType === "grant" ? "Grant Fund" : "Current Fund"}
                          </h3>
                          <span className="text-xs font-mono bg-slate-100 px-2 py-1 rounded text-slate-600">Next PR: {generateNextPrNumber()}</span>
                        </div>
                        <form onSubmit={submitNewApplication} className="space-y-3 text-xs">
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                              <label className="font-semibold text-slate-600">Advance Amount (PKR)</label>
                              <input type="number" required value={newAmount} onChange={(e) => setNewAmount(e.target.value)} placeholder="e.g. 50,000" className="w-full mt-1 border rounded-md px-3 py-2 text-sm" />
                            </div>
                            <div>
                              <label className="font-semibold text-slate-600">Mapped Fund Center</label>
                              <div className="mt-1 border border-slate-200 bg-slate-50 rounded-md px-3 py-2 text-xs text-slate-700 font-mono font-bold">
                                {currentEmp.fundCenterNum} - {currentEmp.fundCenterName}
                              </div>
                            </div>
                          </div>
                          <div>
                            <label className="font-semibold text-slate-600">Business Purpose</label>
                            <input type="text" required value={newPurpose} onChange={(e) => setNewPurpose(e.target.value)} placeholder="e.g. Operational expense advance" className="w-full mt-1 border rounded-md px-3 py-2 text-sm" />
                          </div>
                          <div>
                            <label className="font-semibold text-slate-600">Supporting Documents </label>
                            <div className="mt-1 flex flex-wrap items-center gap-2">
                              <label className="inline-flex items-center gap-1.5 border border-dashed border-slate-300 px-3 py-1.5 rounded-md text-xs text-slate-600 cursor-pointer bg-slate-50 hover:bg-slate-100">
                                <span>📎 Upload document(s)</span>
                                <input type="file" multiple accept={DOC_ACCEPT} className="hidden" onChange={(e) => { const picked = Array.from(e.target.files || []); e.target.value = ""; addDocsWithOcr(picked, setNewPurposeDocs); }} />
                              </label>
                              <span className="text-[11px] text-slate-400">For purpose of the advance (.pdf, .doc, .docx, .jpg, .png).</span>
                            </div>
                            {newPurposeDocs.length > 0 && (
                              <div className="mt-2 space-y-1">
                                {newPurposeDocs.map(d => (
                                  <div key={d.id} className="flex flex-wrap items-center gap-3">
                                    <a href={d.url} download={d.name} className="text-blue-600 underline font-medium">📎 {d.name}</a>
                                    <button type="button" onClick={() => setNewPurposeDocs(prev => prev.filter(x => x.id !== d.id))} className="text-red-600 hover:text-red-800 font-medium">❌ Remove File</button>
                                    <OcrBadge item={d} />
                                    <OcrDetails item={d} />
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                          <div className="flex justify-end pt-2">
                            <button type="submit" className="bg-[#001b4d] text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-900">Submit PR for HoD Approval</button>
                          </div>
                        </form>
                      </div>
                    )}

                    <div className="space-y-4">
                      <h3 className="text-sm font-bold text-[#001b4d]">My Advance Requests & Settlements</h3>
                      {myAdvances.length === 0 && (
                        <div className="bg-white border rounded-xl p-8 text-center text-slate-500 text-xs">No advance requests found for this profile.</div>
                      )}
                      {myAdvances.map((a) => {
                        const isOpen = openId === a.id;
                        const currentDraft = getDraft(a.id);
                        const totalAllocated = currentDraft.reduce((sum, l) => sum + (Number(l.amount) || 0), 0);
                        const remaining = a.amount - totalAllocated;
                        const progressPct = Math.min(100, (totalAllocated / a.amount) * 100);
                        const isOverClaim = totalAllocated > a.amount;
                        const currentChoice = settlementChoices[a.id] || { mode: "salary_deduction", ref: "", fileName: "", fileUrl: "" };

                        return (
                          <div key={a.id} className="border border-slate-200 bg-white rounded-xl shadow-sm overflow-hidden transition-all">
                            <div className="p-4 flex flex-wrap justify-between items-center gap-2 cursor-pointer bg-white hover:bg-slate-50/50" onClick={() => setOpenId(isOpen ? null : a.id)}>
                              <div>
                                <div className="text-sm font-bold text-[#001b4d]">{a.purpose}</div>
                                <div className="text-xs text-slate-500 mt-0.5">
                                  <span className="font-mono font-bold text-slate-700">{a.prNumber}</span> · FC: {a.fundCenterNum} · Advance <strong className="text-slate-800">{money(a.amount)}</strong>
                                </div>
                              </div>
                              <span className={`px-3 py-1 rounded-full text-xs font-semibold border ${
                                a.status === 'pending_hod' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                a.status === 'pending_accounts' ? 'bg-cyan-50 text-cyan-700 border-cyan-200' :
                                a.status === 'pending_treasury' ? 'bg-blue-50 text-blue-700 border-blue-200' :
                                a.status === 'outstanding' ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 
                                a.status === 'submitted' ? 'bg-purple-50 text-purple-700 border-purple-200' : 
                                a.status === 'pending_posting' ? 'bg-teal-50 text-teal-700 border-teal-200' : 
                                a.status === 'rejected' ? 'bg-red-50 text-red-700 border-red-200' :
                                'bg-green-50 text-green-700 border-green-200'
                              }`}>
                                {a.status === 'pending_hod' ? 'Pending HoD' : 
                                 a.status === 'pending_accounts' ? 'Pending Accounts Review' : 
                                 a.status === 'pending_treasury' ? 'Pending Treasury' : 
                                 a.status === 'outstanding' ? 'Outstanding' : 
                                 a.status === 'submitted' ? 'Pending Audit' : 
                                 a.status === 'pending_posting' ? 'Pending Posting Approval' : 
                                 a.status === 'rejected' ? 'Rejected by Accounts' : `Settled (${a.sapDocRef})`}
                              </span>
                            </div>

                            {isOpen && (
                              <div className="p-5 border-t border-slate-100 bg-slate-50/30 space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                                  <div className="bg-white border p-3 rounded-lg"><span className="text-slate-400 block">Date Disbursed:</span><span className="font-bold text-slate-700">{a.disbursedOn || "Pending Payout"}</span></div>
                                  <div className="bg-white border p-3 rounded-lg"><span className="text-slate-400 block">Fund Center:</span><span className="font-bold text-[#001b4d]">{a.fundCenterNum} ({a.fundCenterName})</span></div>
                                  <div className="bg-white border p-3 rounded-lg"><span className="text-slate-400 block">Department Unit:</span><span className="font-bold text-slate-700">{a.dept}</span></div>
                                </div>

                                {(a.purposeDocs || []).length > 0 && (
                                  <div className="bg-white border p-3 rounded-lg text-xs">
                                    <span className="text-slate-400 block mb-1">Purpose Supporting Documents:</span>
                                    <DocLinks docs={a.purposeDocs} />
                                  </div>
                                )}

                                {a.status === "rejected" && (
                                  <div className="bg-red-50 border border-red-300 rounded-lg p-4 text-xs text-red-900 space-y-2">
                                    <div className="font-bold flex items-center gap-1.5 text-red-800">
                                      <span>⚠️ Advance Request Rejected by Accounts{a.advanceRejectedOn ? ` on ${a.advanceRejectedOn}` : ""}</span>
                                    </div>
                                    {(a.rejectionReasons || []).length > 0 && (
                                      <ul className="list-disc pl-5 text-red-700 space-y-0.5">
                                        {a.rejectionReasons.map(r => <li key={r}>{r}</li>)}
                                      </ul>
                                    )}
                                    {a.rejectionNote && (
                                      <p className="text-red-700"><strong>Accounts Remarks:</strong> {a.rejectionNote}</p>
                                    )}
                                  </div>
                                )}

                                {a.status === "outstanding" && a.rejectionReason && (
                                  <div className="bg-red-50 border border-red-300 rounded-lg p-4 text-xs text-red-900 space-y-1">
                                    <div className="font-bold flex items-center gap-1.5 text-red-800">
                                      <span>⚠️ Previous Settlement Rejected by Accounts</span>
                                    </div>
                                    <p className="text-red-700"><strong>Accounts Feedback:</strong> {a.rejectionReason}</p>
                                    <p className="text-[11px] text-red-600 pt-1">Please reconsider supporting evidence, correct receipt attachments or justify the expense before resubmitting.</p>
                                  </div>
                                )}

                                {a.status === "outstanding" ? (
                                  <div>
                                    <div className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Submit receipts & supporting documents</div>
                                    <div className="space-y-3">
                                      {currentDraft.map((line) => (
                                        <div key={line.id} className="bg-white border border-slate-200 rounded-lg p-3.5 space-y-3 text-xs">
                                          <div className="grid grid-cols-1 md:grid-cols-[1fr_130px_120px] gap-2 items-center">
                                            <input value={line.description} onChange={(e) => editLine(a.id, line.id, "description", e.target.value)} placeholder="Receipt description" className="border rounded-md px-3 py-2 text-sm" />
                                            <select value={line.category} onChange={(e) => editLine(a.id, line.id, "category", e.target.value)} className="border rounded-md px-3 py-2 text-sm bg-white">
                                              {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                                            </select>
                                            <input type="number" value={line.amount} onChange={(e) => editLine(a.id, line.id, "amount", e.target.value)} placeholder="Amount (e.g. 15,000)" className="border rounded-md px-3 py-2 text-sm" />
                                          </div>
                                          
                                          <div className="flex flex-wrap justify-between items-center pt-1 gap-2">
                                            <div className="flex items-center gap-2">
                                              <label className="inline-flex items-center gap-1.5 border border-dashed border-slate-300 px-3 py-1.5 rounded-md text-xs text-slate-600 cursor-pointer bg-slate-50 hover:bg-slate-100">
                                                <span>📎 {line.fileName || "Upload receipt"}</span>
                                                <input type="file" accept=".pdf,.jpg,.jpeg,.png" className="hidden" onChange={(e) => handleFileUpload(a.id, line.id, e.target.files[0])} />
                                              </label>
                                              {line.fileName && (
                                                <div className="flex items-center gap-2 text-xs">
                                                  <a href={line.fileUrl} download={line.fileName} className="text-blue-600 underline font-medium">📥 Download</a>
                                                  <button onClick={() => removeAttachment(a.id, line.id)} className="text-red-600 hover:text-red-800 font-medium">❌ Remove File</button>
                                                </div>
                                              )}
                                            </div>

                                            {currentDraft.length > 1 && (
                                              <button onClick={() => removeLine(a.id, line.id)} className="text-slate-400 hover:text-red-600 text-xs">🗑️ Remove Line</button>
                                            )}
                                          </div>
                                          {line.fileName && line.ocrStatus && (
                                            <div className="flex flex-wrap items-center gap-2 text-[11px]">
                                              <OcrBadge item={line} />
                                              {!line.amount && detectAmount(line.ocrText) && (
                                                <button type="button" onClick={() => editLine(a.id, line.id, "amount", String(detectAmount(line.ocrText)))} className="px-2 py-0.5 rounded border border-blue-300 text-blue-700 font-semibold bg-blue-50 hover:bg-blue-100">
                                                  Use detected amount: {money(detectAmount(line.ocrText))}
                                                </button>
                                              )}
                                              <OcrDetails item={line} />
                                            </div>
                                          )}
                                        </div>
                                      ))}
                                    </div>

                                    <button onClick={() => addLine(a.id)} className="mt-3 text-xs font-bold text-[#001b4d] hover:underline">➕ Add another receipt line</button>

                                    <div className="mt-6 bg-white border border-slate-200 rounded-lg p-4 text-xs">
                                      <div className="h-2.5 w-full rounded-full bg-slate-100 overflow-hidden mb-2">
                                        <div className={`h-full transition-all duration-300 ${isOverClaim ? 'bg-red-500' : 'bg-[#001b4d]'}`} style={{ width: `${Math.min(100, progressPct)}%` }} />
                                      </div>
                                      <div className="flex justify-between font-medium text-slate-600">
                                        <span>{money(totalAllocated)} of {money(a.amount)} allocated</span>
                                        {isOverClaim ? (
                                          <span className="text-red-600 font-bold animate-pulse">
                                            ⚠️ Over-claim : Receipts exceed advance by {money(totalAllocated - a.amount)}
                                          </span>
                                        ) : (
                                          <span className={remaining > 0 ? 'text-amber-700 font-bold' : 'text-green-700 font-bold'}>
                                            {remaining > 0 ? `${money(remaining)} unspent remainder` : 'Fully balanced!'}
                                          </span>
                                        )}
                                      </div>
                                    </div>

                                    {remaining > 0 && !isOverClaim && (
                                      <div className="mt-4 bg-amber-50 border border-amber-200 rounded-lg p-4 space-y-3 text-xs text-amber-900">
                                        <div className="font-bold">⚠️ Unspent Advance Balance Detected: {money(remaining)}</div>
                                        <p>Select how to settle this remaining unspent balance:</p>
                                        <div className="space-y-2">
                                          <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name={`settlement_${a.id}`} checked={currentChoice.mode === "salary_deduction"} onChange={() => setSettlementChoices(prev => ({ ...prev, [a.id]: { ...currentChoice, mode: "salary_deduction" } }))} />
                                            <span><strong>Salary Deduction:</strong> Deduct unspent amount from monthly payroll.</span>
                                          </label>
                                          <label className="flex items-center gap-2 cursor-pointer">
                                            <input type="radio" name={`settlement_${a.id}`} checked={currentChoice.mode === "cash_refund"} onChange={() => setSettlementChoices(prev => ({ ...prev, [a.id]: { ...currentChoice, mode: "cash_refund" } }))} />
                                            <span><strong>Refund to LUMS:</strong> Submit money back via deposit slip / cheque.</span>
                                          </label>
                                        </div>

                                        {currentChoice.mode === "cash_refund" && (
                                          <div className="mt-3 pt-3 border-t border-amber-200 space-y-2 bg-white p-3 rounded-md">
                                            <div className="font-semibold text-slate-700">Refund Supporting Evidence:</div>
                                            <div>
                                              <label className="block text-[11px] text-slate-500">Transaction Reference / Deposit Slip No.</label>
                                              <input type="text" value={currentChoice.ref || ""} onChange={e => setSettlementChoices(prev => ({ ...prev, [a.id]: { ...currentChoice, ref: e.target.value } }))} placeholder="e.g. HBL-REF-771829" className="w-full mt-1 border rounded p-1.5 text-xs" />
                                            </div>
                                            <div>
                                              <label className="block text-[11px] text-slate-500">Upload Deposit Slip / Cheque Image</label>
                                              <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e => handleRefundProofUpload(a.id, e.target.files[0])} className="w-full mt-1 text-xs" />
                                              {currentChoice.fileName && <span className="text-[11px] text-green-700 font-semibold">Attached: {currentChoice.fileName}</span>}
                                            </div>
                                          </div>
                                        )}
                                      </div>
                                    )}

                                    <div className="mt-5 flex justify-end">
                                      <button onClick={() => submitClaim(a)} className="bg-[#001b4d] hover:bg-blue-900 text-white px-5 py-2.5 rounded-lg text-xs font-bold shadow-sm">
                                        Submit Claim for Accounts Audit
                                      </button>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="text-xs text-slate-600 bg-white p-3 rounded border">
                                    Status: <strong>{a.status}</strong> {a.sapDocRef && `· SAP Doc: ${a.sapDocRef}`}
                                  </div>
                                )}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {role === "hod" && (() => {
                  const filteredHodQueue = hodSelectedFc === "ALL" 
                    ? hodQueue 
                    : hodQueue.filter(a => a.fundCenterNum === hodSelectedFc);

                  return (
                    <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-4">
                      <div className="flex flex-wrap justify-between items-center border-b pb-3 gap-4">
                        <div>
                          <h3 className="text-base font-bold text-[#001b4d]">👔 HoD Review & Approval Queue</h3>
                          <p className="text-xs text-slate-500">Review and authorize purchase requisition advances across your department units.</p>
                        </div>
                        
                        <div className="flex items-center gap-2 text-xs bg-slate-50 p-2 rounded-lg border">
                          <span className="font-bold text-slate-700">Filter Department / Fund Center:</span>
                          <select 
                            value={hodSelectedFc} 
                            onChange={e => setHodSelectedFc(e.target.value)}
                            className="border border-slate-300 rounded-md p-1.5 bg-white font-medium text-[#001b4d]"
                          >
                            <option value="ALL">All Departments ({hodQueue.length} Pending)</option>
                            {Array.from(new Set(hodQueue.map(a => a.fundCenterNum))).map(fcNum => {
                              const fcObj = OFFICIAL_FUND_CENTERS.find(f => f.code === fcNum) || { name: fcNum };
                              const count = hodQueue.filter(a => a.fundCenterNum === fcNum).length;
                              return (
                                <option key={fcNum} value={fcNum}>
                                  {fcNum} - {fcObj.name} ({count} pending)
                                </option>
                              );
                            })}
                          </select>
                        </div>
                      </div>

                      {filteredHodQueue.length === 0 ? (
                        <div className="border border-dashed border-slate-200 rounded-lg p-8 text-center text-sm text-slate-500 bg-slate-50">
                          No pending advance requests matching the selected Fund Center filter.
                        </div>
                      ) : (
                        <div className="space-y-4">
                          {filteredHodQueue.map(a => {
                            const emp = empOf(a);
                            return (
                              <div key={a.id} className="border border-slate-200 rounded-lg p-4 bg-slate-50 flex flex-wrap justify-between items-center gap-4 text-xs">
                                <div>
                                  <div className="text-sm font-bold text-[#001b4d]">{a.purpose}</div>
                                  <div className="text-slate-500 mt-1">
                                    Requested by: <strong className="text-slate-700">{emp ? emp.name : "Unknown"}</strong> · Fund Center: <strong className="text-[#001b4d] font-mono">{a.fundCenterNum} ({a.fundCenterName})</strong>
                                  </div>
                                  <div className="text-sm font-bold text-slate-900 mt-1">Amount: {money(a.amount)} (<span className="font-mono text-indigo-700">{a.prNumber}</span>)</div>
                                  {(a.purposeDocs || []).length > 0 && (
                                    <div className="mt-1"><span className="text-slate-500">Purpose documents: </span><DocLinks docs={a.purposeDocs} /></div>
                                  )}
                                </div>
                                <div className="flex gap-2">
                                  <button onClick={() => hodAction(a.id, false)} className="bg-red-50 text-red-700 border border-red-200 px-4 py-2 rounded font-bold">Reject</button>
                                  <button onClick={() => hodAction(a.id, true)} className="bg-green-600 text-white px-4 py-2 rounded font-bold shadow-sm">Approve & Forward to Accounts</button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })()}

                {role === "it_budget" && (
                  <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6">
                    <div>
                      <h3 className="text-base font-bold text-[#001b4d] mb-1">Budget Team & IT Vetting Workflow</h3>
                      <p className="text-xs text-slate-500">Newly registered employee profiles must be vetted by Budget (Fund Center mapping) and IT (master data activation) before being permitted to request advances.</p>
                    </div>

                    <div>
                      <div className="flex items-center gap-2 mb-3">
                        <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-md">Stage 1: Budget Team Vetting</span>
                      </div>
                      {pendingBudgetList.length === 0 ? (
