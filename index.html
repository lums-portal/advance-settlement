                                </div>

                                <div className="border border-red-200 bg-red-50/50 p-3.5 rounded-lg space-y-2">
                                  <label className="font-bold text-red-900 block">Reject Settlement & Intimate User to Reconsider Evidence:</label>
                                  <textarea 
                                    rows="2" 
                                    value={financeRejectReason} 
                                    onChange={e => setFinanceRejectReason(e.target.value)} 
                                    placeholder="Specify reason e.g., Incorrect document attached, expense not justifying advance purpose, or money spent elsewhere..."
                                    className="w-full border border-red-300 rounded p-2 text-xs bg-white focus:outline-none focus:ring-1 focus:ring-red-500"
                                  />
                                  <div className="flex justify-end">
                                    <button onClick={() => financeReject(target.id)} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold shadow-sm">
                                      ❌ Reject & Request Reconsideration
                                    </button>
                                  </div>
                                </div>

                                <div className="border border-slate-200 p-3.5 rounded-lg space-y-2">
                                  <label className="font-bold text-slate-700 block">Note  (optional):</label>
                                  <input type="text" value={postingNote} onChange={e => setPostingNote(e.target.value)} placeholder="e.g. Receipts verified, tax deducted as per policy..." className="w-full border border-slate-300 rounded p-2 text-xs bg-white" />
                                </div>

                                <div className="pt-2 flex justify-end border-t">
                                  <button onClick={() => financeSaveForPosting(target.id)} className="bg-[#001b4d] hover:bg-blue-900 text-white px-5 py-2.5 rounded-lg font-bold shadow-sm">
                                    💾 Reviewed — Save as Complete 
                                  </button>
                                </div>
                              </div>
                            );
                          })() : <div className="p-8 text-center text-xs text-slate-400">Select submission from left.</div>}
                        </div>
                      </div>
                    )
                    )}

                    {financeTab === "posting_approval" && (
                      postingQueue.length === 0 ? (
                        <div className="border border-dashed border-slate-200 rounded-lg p-8 text-center bg-slate-50 text-sm text-slate-500">No saved documents pending final posting.</div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                          <div className="border border-slate-200 rounded-lg divide-y divide-slate-100 overflow-hidden bg-white">
                            <div className="bg-slate-50 px-3 py-2 text-xs font-bold text-slate-500 uppercase">Saved for Posting ({postingQueue.length})</div>
                            {postingQueue.map(item => {
                              const emp = empOf(item);
                              const isSelected = postingSelectedId === item.id;
                              return (
                                <button key={item.id} onClick={() => { setPostingSelectedId(item.id); setPostingReturnReason(""); }} className={`w-full text-left p-3 transition-colors ${isSelected ? 'bg-blue-50/80 border-l-4 border-[#001b4d]' : 'hover:bg-slate-50'}`}>
                                  <div className="text-sm font-bold text-[#001b4d]">{emp?.name}</div>
                                  <div className="text-xs text-slate-500 truncate">{item.purpose}</div>
                                  <div className="mt-1 text-xs font-mono text-indigo-700 font-bold">{item.prNumber} · {item.savedDocRef}</div>
                                </button>
                              );
                            })}
                          </div>
                          <div className="md:col-span-2 border border-slate-200 rounded-lg p-5 bg-white shadow-2xs">
                            {postingSelectedId ? (() => {
                              const postItem = postingQueue.find(i => i.id === postingSelectedId);
                              if (!postItem) return <div className="p-8 text-center text-xs text-slate-400">Select a saved document from the left.</div>;
                              const postEmp = empOf(postItem);
                              const postClaimed = postItem.claim.lines.reduce((s, l) => s + Number(l.amount), 0);
                              const postVariance = postItem.amount - postClaimed;

                              return (
                                <div className="space-y-4 text-xs">
                                  <div className="flex justify-between items-start border-b pb-3">
                                    <div>
                                      <h4 className="text-sm font-bold text-[#001b4d]">{postItem.purpose}</h4>
                                      <p className="text-slate-500">Employee: <strong>{postEmp?.name}</strong> · FC: <span className="font-mono text-[#001b4d]">{postItem.fundCenterNum} ({postItem.fundCenterName})</span></p>
                                    </div>
                                    <span className="bg-teal-100 text-teal-800 text-xs px-2.5 py-1 rounded-full font-bold">Pending Posting Approval</span>
                                  </div>

                                  <div className="bg-teal-50/60 border border-teal-200 rounded-lg p-3.5 space-y-1">
                                    <div className="flex justify-between"><span>Saved Document:</span><span className="font-mono font-bold text-teal-800">{postItem.savedDocRef}</span></div>
                                    <div className="flex justify-between"><span>Reviewed & Saved By:</span><span className="font-bold">{postItem.savedBy || "Accounts Payables"}{postItem.savedOn ? ` on ${postItem.savedOn}` : ""}</span></div>
                                    {postItem.postingNote && <div className="pt-1"><strong>Note:</strong> {postItem.postingNote}</div>}
                                  </div>

                                  <div className="border rounded-lg overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                      <thead className="bg-slate-50 text-slate-500 border-b">
                                        <tr><th className="p-2.5">Description</th><th className="p-2.5">Proof</th><th className="p-2.5 text-right">Amount</th></tr>
                                      </thead>
                                      <tbody className="divide-y">
                                        {postItem.claim.lines.map(l => (
                                          <tr key={l.id}>
                                            <td className="p-2.5 font-medium">{l.description}</td>
                                            <td className="p-2.5">{l.fileUrl ? <a href={l.fileUrl} download={l.fileName} className="text-blue-600 underline font-bold">📎 {l.fileName}</a> : <span className="text-slate-400">N/A</span>}<OcrDetails item={l} /></td>
                                            <td className="p-2.5 text-right font-semibold">{money(l.amount)}</td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  </div>

                                  <div className="bg-slate-50 p-3.5 rounded-lg border space-y-1">
                                    <div className="flex justify-between"><span>Advance:</span><span className="font-bold">{money(postItem.amount)}</span></div>
                                    <div className="flex justify-between"><span>Claimed:</span><span className="font-bold">{money(postClaimed)}</span></div>
                                    <div className="flex justify-between border-t pt-1 font-bold">
                                      <span>Variance / Unspent:</span>
                                      <span className={postVariance > 0 ? "text-amber-700" : "text-green-700"}>{money(postVariance)}</span>
                                    </div>
                                    {postVariance > 0 && (
                                      <div className="mt-2 p-2 bg-amber-50 border border-amber-200 rounded text-amber-900">
                                        <strong>Selected Settlement Mode:</strong> {postItem.settlementMode === 'salary_deduction' ? 'Payroll Salary Deduction' : `Refund to LUMS (Ref: ${postItem.refundDetails?.ref || 'N/A'})`}
                                        {postItem.refundDetails?.fileUrl && (
                                          <div className="mt-1">
                                            <a href={postItem.refundDetails.fileUrl} download={postItem.refundDetails.fileName} className="text-blue-600 underline font-bold">📥 Download Deposit Slip / Cheque Proof</a>
                                          </div>
                                        )}
                                      </div>
                                    )}
                                  </div>

                                  <div className="border border-red-200 bg-red-50/50 p-3.5 rounded-lg space-y-2">
                                    <label className="font-bold text-red-900 block">Return to Accounts Reviewer (reason required):</label>
                                    <textarea
                                      rows="2"
                                      value={postingReturnReason}
                                      onChange={e => setPostingReturnReason(e.target.value)}
                                      placeholder="Specify what the reviewer needs to re-check before this can be posted..."
                                      className="w-full border border-red-300 rounded p-2 text-xs bg-white focus:outline-none focus:ring-1 focus:ring-red-500"
                                    />
                                    <div className="flex justify-end">
                                      <button onClick={() => financeReturnForReview(postItem.id)} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold shadow-sm">
                                        ↩ Return for Review
                                      </button>
                                    </div>
                                  </div>

                                  <div className="pt-2 flex justify-end border-t">
                                    <button onClick={() => financeSettle(postItem.id)} className="bg-[#001b4d] hover:bg-blue-900 text-white px-5 py-2.5 rounded-lg font-bold shadow-sm">
                                      ✅ Approve & Post Settlement to SAP
                                    </button>
                                  </div>
                                </div>
                              );
                            })() : <div className="p-8 text-center text-xs text-slate-400">Select a saved document from the left.</div>}
                          </div>
                        </div>
                      )
                    )}
                  </div>
                )}

                {role === "admin_summary" && (
                  <div className="space-y-6">
                    <div className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-6">
                      <div className="flex flex-wrap justify-between items-center gap-4">
                        <div>
                          <h3 className="text-base font-bold text-[#001b4d] mb-1">Admin Summary Dashboard</h3>
                          <p className="text-xs text-slate-500">Comprehensive overview of open, partially settled, and fully settled PRs with exact days outstanding & aging analysis.</p>
                        </div>
                        
                        <div className="flex items-center gap-3">
                          <div className="flex items-center gap-2 bg-slate-50 p-2 rounded-lg border text-xs">
                            <div>
                              <span className="text-slate-500 block">From:</span>
                              <input type="date" value={startDateFilter} onChange={e => setStartDateFilter(e.target.value)} className="border rounded p-1 bg-white" />
                            </div>
                            <div>
                              <span className="text-slate-500 block">To:</span>
                              <input type="date" value={endDateFilter} onChange={e => setEndDateFilter(e.target.value)} className="border rounded p-1 bg-white" />
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="flex flex-wrap justify-between items-center gap-3 bg-slate-100 p-3 rounded-lg border text-xs">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-slate-700">Sort By:</span>
                          <select value={dashboardSort} onChange={e => setDashboardSort(e.target.value)} className="border rounded px-2.5 py-1.5 bg-white font-medium text-[#001b4d]">
                            <option value="recent_old">Most Recent to Oldest (Date)</option>
                            <option value="old_recent">Oldest to Most Recent (Date)</option>
                            <option value="aging_new_old">Aging: New to Old</option>
                            <option value="aging_old_new">Aging: Old to New</option>
                            <option value="amount_small_large">Amount: Smallest to Largest</option>
                            <option value="amount_large_small">Amount: Largest to Smallest</option>
                          </select>
                        </div>

                        {selectedAgingBucket && (
                          <div className="flex items-center gap-2 bg-indigo-100 text-indigo-900 px-3 py-1 rounded-full font-semibold">
                            <span>Filtering by Aging Bucket: <strong>{selectedAgingBucket}</strong></span>
                            <button onClick={() => setSelectedAgingBucket(null)} className="ml-1 text-xs bg-indigo-200 hover:bg-indigo-300 rounded-full px-1.5 py-0.2">✕ Clear</button>
                          </div>
                        )}
                      </div>

                      <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4">
                        <div className="flex justify-between items-center mb-3">
                          <h4 className="text-xs font-bold uppercase tracking-wider text-indigo-900">Interactive Aging Analysis (Click a bucket to filter)</h4>
                          {selectedAgingBucket && <span className="text-[11px] text-indigo-700 font-medium">Click active bucket again or clear to reset</span>}
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                          {[
                            { key: "<1 month", label: "< 1 month", count: agingBuckets["<1 month"], color: "text-[#001b4d]" },
                            { key: "<3 months", label: "< 3 months", count: agingBuckets["<3 months"], color: "text-amber-600" },
                            { key: "<6 months", label: "< 6 months", count: agingBuckets["<6 months"], color: "text-orange-600" },
                            { key: "+6 months", label: "+ 6 months", count: agingBuckets["+6 months"], color: "text-red-600" }
                          ].map(bucket => {
                            const isSelected = selectedAgingBucket === bucket.key;
                            return (
                              <div 
                                key={bucket.key}
                                onClick={() => setSelectedAgingBucket(isSelected ? null : bucket.key)}
                                className={`bg-white p-3 rounded-lg border cursor-pointer transition-all shadow-2xs hover:shadow-md ${
                                  isSelected ? 'border-indigo-600 ring-2 ring-indigo-400 bg-indigo-50/50' : 'border-indigo-100 hover:border-indigo-300'
                                }`}
                              >
                                <span className="text-slate-500 block text-xs">{bucket.label}</span>
                                <span className={`text-lg font-bold ${bucket.color}`}>{bucket.count}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      <div className="space-y-4">
                        <div className="border border-slate-200 rounded-xl overflow-hidden">
                          <div onClick={() => setSummaryDropdownOpen(s => ({ ...s, open: !s.open }))} className="bg-slate-100 px-4 py-3 flex justify-between items-center cursor-pointer font-bold text-xs text-[#001b4d]">
                            <span>📂 Open Advances / Outstanding ({summaryOpenAdvances.length})</span>
                            <span>{summaryDropdownOpen.open ? '▲' : '▼'}</span>
                          </div>
                          {summaryDropdownOpen.open && (
                            <div className="p-4 bg-white space-y-2">
                              {summaryOpenAdvances.length > 0 && (
                                <div className="flex flex-wrap justify-between items-center gap-3 bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs mb-3">
                                  <label className="flex items-center gap-2 cursor-pointer font-bold text-[#001b4d]">
                                    <input
                                      type="checkbox"
                                      checked={allVisibleSelected}
                                      onChange={() => setSelectedReminderIds(allVisibleSelected ? [] : summaryOpenAdvances.map(a => a.id))}
                                    />
                                    <span>Select all shown ({summaryOpenAdvances.length})</span>
                                  </label>
                                  <div className="flex flex-wrap items-center gap-2">
                                    <span className="text-slate-500">📧 Settlement Reminder Emails:</span>
                                    <button
                                      disabled={selectedVisibleReminders.length === 0}
                                      onClick={() => sendReminderEmails(selectedVisibleReminders)}
                                      className={`px-3 py-1.5 rounded font-bold border ${selectedVisibleReminders.length === 0 ? "bg-slate-100 text-slate-400 border-slate-300 cursor-not-allowed" : "bg-white text-[#001b4d] border-[#001b4d] hover:bg-slate-50"}`}
                                    >
                                      Send to Selected ({selectedVisibleReminders.length})
                                    </button>
                                    <button
                                      onClick={() => sendReminderEmails(summaryOpenAdvances)}
                                      className="bg-[#001b4d] hover:bg-blue-900 text-white px-3 py-1.5 rounded font-bold shadow-sm"
                                    >
                                      {selectedAgingBucket ? `Send to All in "${selectedAgingBucket}" (${summaryOpenAdvances.length})` : `Send to All Pending Advances (${summaryOpenAdvances.length})`}
                                    </button>
                                  </div>
                                </div>
                              )}
                              {summaryOpenAdvances.length === 0 ? <p className="text-xs text-slate-400">No open advances matching filter criteria.</p> : (
                                summaryOpenAdvances.map(a => {
                                  const emp = empOf(a);
                                  const ageDays = daysAgo(a.disbursedOn);
                                  const agingCat = getAgingCategory(ageDays);
                                  return (
                                    <div key={a.id} className="border rounded p-3 flex justify-between items-center text-xs bg-slate-50/50">
                                      <div className="flex items-start gap-3">
                                        <input
                                          type="checkbox"
                                          className="mt-1"
                                          checked={selectedReminderIds.includes(a.id)}
                                          onChange={() => toggleReminderSelect(a.id)}
                                          title="Select to send settlement reminder email"
                                        />
                                        <div>
                                          <div className="font-bold text-[#001b4d]">{a.purpose}</div>
                                          <div className="text-slate-500">
                                            Employee: {emp?.name} · FC: <span className="font-mono text-[#001b4d]">{a.fundCenterNum} ({a.fundCenterName})</span> · PR: <span className="font-mono text-indigo-700">{a.prNumber}</span> · Disbursed: {a.disbursedOn} (<strong className="text-indigo-900">{ageDays} days outstanding</strong> — {agingCat})
                                          </div>
                                          {a.reminderCount > 0 && (
                                            <div className="text-[11px] text-blue-700 mt-0.5">📧 Last reminder sent: {a.lastReminderOn} ({a.reminderCount} sent)</div>
                                          )}
                                        </div>
                                      </div>
                                      <div className="text-right font-bold text-slate-800">{money(a.amount)}</div>
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          )}
                        </div>

                        <div className="border border-slate-200 rounded-xl overflow-hidden">
                          <div onClick={() => setSummaryDropdownOpen(s => ({ ...s, partial: !s.partial }))} className="bg-slate-100 px-4 py-3 flex justify-between items-center cursor-pointer font-bold text-xs text-[#001b4d]">
                            <span>📂 Partially Settled / Unspent Balances ({summaryPartialAdvances.length})</span>
                            <span>{summaryDropdownOpen.partial ? '▲' : '▼'}</span>
                          </div>
                          {summaryDropdownOpen.partial && (
                            <div className="p-4 bg-white space-y-2">
                              {summaryPartialAdvances.length === 0 ? <p className="text-xs text-slate-400">No partially settled advances matching criteria.</p> : (
                                summaryPartialAdvances.map(a => {
                                  const emp = empOf(a);
                                  const claimed = a.claim.lines.reduce((s,l) => s + Number(l.amount), 0);
                                  const variance = a.amount - claimed;
                                  const ageDays = daysAgo(a.disbursedOn);
                                  return (
                                    <div key={a.id} className="border rounded p-3 flex justify-between items-center text-xs bg-slate-50/50">
                                      <div>
                                        <div className="font-bold text-[#001b4d]">{a.purpose}</div>
                                        <div className="text-slate-500">Employee: {emp?.name} · FC: <span className="font-mono text-[#001b4d]">{a.fundCenterNum}</span> · Age: <strong className="text-indigo-900">{ageDays} days</strong> · Mode: <strong>{a.settlementMode}</strong></div>
                                      </div>
                                      <div className="text-right">
                                        <div className="font-bold text-amber-700">Unspent: {money(variance)}</div>
                                        <span className="text-[10px] text-slate-400">Total Advance: {money(a.amount)}</span>
                                      </div>
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          )}
                        </div>

                        <div className="border border-slate-200 rounded-xl overflow-hidden">
                          <div onClick={() => setSummaryDropdownOpen(s => ({ ...s, settled: !s.settled }))} className="bg-slate-100 px-4 py-3 flex justify-between items-center cursor-pointer font-bold text-xs text-[#001b4d]">
                            <span>📂 Fully Settled PRs ({summarySettledPRs.length})</span>
                            <span>{summaryDropdownOpen.settled ? '▲' : '▼'}</span>
                          </div>
                          {summaryDropdownOpen.settled && (
                            <div className="p-4 bg-white space-y-2">
                              {summarySettledPRs.length === 0 ? <p className="text-xs text-slate-400">No fully settled PRs matching criteria.</p> : (
                                summarySettledPRs.map(a => {
                                  const emp = empOf(a);
                                  return (
                                    <div key={a.id} className="border rounded p-3 flex justify-between items-center text-xs bg-slate-50/50">
                                      <div>
                                        <div className="font-bold text-[#001b4d]">{a.purpose}</div>
                                        <div className="text-slate-500">Employee: {emp?.name} · FC: <span className="font-mono text-[#001b4d]">{a.fundCenterNum}</span> · SAP Ref: <span className="font-mono font-bold text-green-700">{a.sapDocRef}</span></div>
                                      </div>
                                      <div className="text-right font-bold text-slate-800">{money(a.amount)}</div>
                                    </div>
                                  );
                                })
                              )}
                            </div>
                          )}
                        </div>

                      </div>
                    </div>
                  </div>
                )}

              </div>

              {showResetModal && (
                <div className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
                  <div className="bg-white rounded-xl p-6 max-w-sm w-full shadow-lg space-y-4">
                    <h4 className="text-sm font-bold text-[#001b4d]">🔄 Master Reset</h4>
                    <p className="text-xs text-slate-500">This will erase all saved advances, claims and employee profiles in this browser and restore the original sample data. Enter the authorisation password to continue.</p>
                    <form onSubmit={performMasterReset} className="space-y-3 text-xs">
                      <input
                        type="password"
                        autoFocus
                        value={resetPassword}
                        onChange={e => { setResetPassword(e.target.value); setResetError(""); }}
                        placeholder="Enter password"
                        className="w-full border rounded p-2 text-sm bg-white"
                      />
                      {resetError && <div className="text-red-600 font-semibold">{resetError}</div>}
                      <div className="flex justify-end gap-2 pt-1">
                        <button type="button" onClick={() => { setShowResetModal(false); setResetPassword(""); setResetError(""); }} className="px-3 py-2 rounded border">Cancel</button>
                        <button type="submit" className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold">Reset All Data</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<AdvancePortal />);
    </script>
</body>
</html>
